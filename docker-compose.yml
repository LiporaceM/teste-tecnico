services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taskmanager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-taskmanager};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Key: ${JWT_KEY:-troque-esta-chave-em-producao-com-32-caracteres-ou-mais}
      SeedData__Enabled: ${SEED_DATA:-true}
      Auth__Provider: ${AUTH_PROVIDER:-local}
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:-}
      Firebase__AdminEmails__0: ${FIREBASE_ADMIN_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:8080"

  web:
    build:
      context: ./frontend
      args:
        VITE_AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
        VITE_FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
